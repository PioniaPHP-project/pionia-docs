[[mounts]]
  source = "assets"
  target = "assets"

# mounts
## archetypes
[[mounts]]
  source = "node_modules/@hyas/doks-core/archetypes"
  target = "archetypes"

[[mounts]]
  source = "archetypes"
  target = "archetypes"

## assets
[[mounts]]
  source = "node_modules/@hyas/core/assets"
  target = "assets"
  excludeFiles = ["js/app.js", "jsconfig.json"]

[[mounts]]
  source = "node_modules/@hyas/images/assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@hyas/doks-core/assets"
  target = "assets"
  excludeFiles = ["js/app.js", "js/custom.js", "js/clipboard.js"]

[[mounts]]
  source = "node_modules/@tabler/icons/icons"
  target = "assets/svgs/tabler-icons"


## content
[[mounts]]
  source = "content"
  target = "content"

## data
[[mounts]]
  source = "node_modules/@hyas/doks-core/data"
  target = "data"

[[mounts]]
  source = "data"
  target = "data"

## i18n
[[mounts]]
  source = "node_modules/@hyas/doks-core/i18n"
  target = "i18n"

[[mounts]]
  source = "i18n"
  target = "i18n"

## layouts
[[mounts]]
  source = "node_modules/@hyas/core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/seo/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/images/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/doks-core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/inline-svg/layouts"
  target = "layouts"

[[mounts]]
  source = "layouts"
  target = "layouts"

## static
[[mounts]]
  source = "node_modules/@hyas/doks-core/static"
  target = "static"

[[mounts]]
  source = "static"
  target = "static"

# Explicit browser entry points keep npm dependencies resolvable in Hugo Pipes.
[[mounts]]
  source = "node_modules/bootstrap/dist/js/bootstrap.esm.js"
  target = "assets/bootstrap.js"
[[mounts]]
  source = "node_modules/@popperjs/core/dist/esm"
  target = "assets/@popperjs"
[[mounts]]
  source = "node_modules/@popperjs/core/dist/esm/popper.js"
  target = "assets/@popperjs/core.js"
[[mounts]]
  source = "node_modules/clipboard/dist/clipboard.js"
  target = "assets/clipboard.js"
[[mounts]]
  source = "node_modules/flexsearch/dist/flexsearch.bundle.module.min.js"
  target = "assets/flexsearch.js"
